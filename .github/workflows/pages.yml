# Pubblica l'app su GitHub Pages a ogni push sul branch di default.
# Prima volta: Settings -> Pages -> Source: "GitHub Actions".
# Su repo privato Pages richiede GitHub Pro (o un repo pubblico).
name: Pubblica app

on:
  push:
    paths:
      - 'app/**'
      - 'model/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Gli altri branch non pubblicano.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          FIUTO_BASE: /${{ github.event.repository.name }}/
      # Link diretti (es. /tartufello/mappa) aperti senza service worker: Pages serve 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
