# Sorgenti dati di fiuto (BRIEF.md §5). Verifica Fase 0: 2026-10-20 (dettagli in FASE0.md).
#
# Regole:
# - Solo valori visti in risposte reali (capabilities, download, metadati). Il resto resta vuoto.
# - status: "ok" (dato raggiungibile e controllato) | "da verificare" | "non trovato".
# - local_path: file (o cartella di raster) scaricato a mano; relativo a pipeline/.
#   Se vuoto, il build usa l'ultimo `fetch`/`prepare` in data/raw/<id>/.
# - [*.service]: identificativi per scaricare da WFS/WCS. [*.attributes]: layer e attributi per il derive.
#
# Nota CRS: i servizi e i pacchetti regionali oggi sono in EPSG:7791 (RDN2008 / UTM 32N) o EPSG:25832;
# la 1:50.000 geologica in zip è ancora in UTMRER (= parametri di EPSG:5659). La pipeline riproietta tutto
# sulla griglia di lavoro (build.toml).

[defaults]
crs = "EPSG:5659"

# ---------------------------------------------------------------------------
[sources.dtm]
title = "DTM 5x5 - ultima edizione (ed. 2025)"
use = "quota (in futuro pendenza e TPI)"
params = ["elevation"]
status = "ok"
status_note = "2026-10-20: WCS 1.0.0 https://servizigis.regione.emilia-romagna.it/wcs/dtm5x5 restituisce float32 a 5 m in EPSG:7791 (coverage DTM5X5_RDN32_RMD, dal catalogo geoportale). Il WCS del brief (wcs/dtm10k_ed2014) è dismesso: coverage '1' etichettata 'Servizio_dismesso_RDN32_RMD', 4 bande uint8 (immagine)."
license = "CC BY 4.0 (PDF di licenza nel pacchetto DTM5x5_ed2025_NO_7791.zip; catalogo geoportale, voce 'DTM 5x5 - ultima edizione'), letta il 2026-10-20"
crs = "EPSG:7791"
local_path = ""

[sources.dtm.endpoints]
wcs = "https://servizigis.regione.emilia-romagna.it/wcs/dtm5x5"
wms = "https://servizigis.regione.emilia-romagna.it/wms/dtm5x5"
pagina_download = "https://geoportale.regione.emilia-romagna.it/download-data/dati-e-prodotti-cartografici-preconfezionati/altimetria/dtm-5m-x-5m-ultima-edizione"
# Quadranti GeoTIFF zippati (alternativa al WCS): estensioni lette dagli header TIFF, nodata -9999.
zip_no = "https://mappegis.regione.emilia-romagna.it/archiviogis/DTM/DTM5x5_ed2025_NO_7791.zip"  # x 508200-655500, y 4922500-5002000
zip_ne = "https://mappegis.regione.emilia-romagna.it/archiviogis/DTM/DTM5x5_ed2025_NE_7791.zip"  # x 655500-802800, y 4922500-5002000
zip_so = "https://mappegis.regione.emilia-romagna.it/archiviogis/DTM/DTM5x5_ed2025_SO_7791.zip"  # x 508200-655500, y 4843000-4922500
zip_se = "https://mappegis.regione.emilia-romagna.it/archiviogis/DTM/DTM5x5_ed2025_SE_7791.zip"  # x 655500-802800, y 4843000-4922500
# Dal brief, non più utilizzabili (2026-10-20):
wcs_brief_dismesso = "https://servizigis.regione.emilia-romagna.it/wcs/dtm10k_ed2014"
wms_brief = "https://servizigis.regione.emilia-romagna.it/wms/dtm10k_ed2014"
metadata = "https://inspire-geoportal.ec.europa.eu/srv/api/records/r_emiro:2016-08-08T155835"  # rimanda a data.europa.eu, non raggiungibile da qui

[sources.dtm.service]
wcs_version = "1.0.0"                 # il server dichiara 1.0.0-1.1.2; GetCoverage provato in 1.0.0
wcs_coverage_id = "DTM5X5_RDN32_RMD"  # DescribeCoverage: EPSG:7791, passo 5 m, 1 banda
wcs_format = "GeoTIFF"
wcs_res = 5
wcs_tile_size_m = 5000

[sources.dtm.attributes]
band = 1
nodata = -9999  # il GeoTIFF del WCS non lo dichiara; -9999 è il nodata dichiarato dai TIFF dello stesso prodotto (quadranti zip)

# ---------------------------------------------------------------------------
[sources.dem10]
title = "DEM 10x10 (usato dalla CAPP)"
use = "alternativa più leggera al DTM 5x5"
params = ["elevation"]
status = "non trovato"
status_note = "2026-10-20: il link del brief (geoportale .../it/download/prodottiraster) ora reindirizza alla home del nuovo geoportale; nel catalogo 'Altimetria' non c'è un DEM 10x10. Superato dal WCS del DTM 5x5."
license = ""
crs = ""
local_path = ""

[sources.dem10.endpoints]
pagina_brief = "http://geoportale.regione.emilia-romagna.it/it/download/prodottiraster"

# ---------------------------------------------------------------------------
[sources.suoli]
title = "Carta dei suoli 1:50.000 - Edizione 2021"
use = "pH, CaCO3 e tessitura 0-30 cm dai profili rappresentativi (prepare suoli)"
params = ["texture", "caco3", "ph"]
status = "ok"
status_note = "2026-10-20: zip open data con shapefile (13677 delineazioni, EPSG:7791) e Carta_Suoli50k.xlsx (fogli anagrafica, delin_suoli, delin_siti, suoli_classif). Copre il 78% della regione (93% basso Appennino, 37% medio Appennino). Nessun attributo diretto di tessitura/CaCO3/pH nei poligoni: si derivano con `prepare suoli`. CALTOT verificato in % (mediane coerenti con le classi 'non/scarsamente/moderatamente/molto calcareo'). WFS wfs/suoli: HTTP 400; WCS wcs/suoli: HTTP 401."
license = "CC BY 4.0 (catalogo geoportale, voce 'Carta dei suoli ... 1:50.000 - Edizione 2021'), letta il 2026-10-20"
crs = "EPSG:7791"
local_path = ""

[sources.suoli.endpoints]
download = "https://mappegis.regione.emilia-romagna.it/moka/ckan/suolo/Carta_Suoli_50k.zip"
wms = "https://servizigis.regione.emilia-romagna.it/wms/suoli"
webgis = "https://geo.regione.emilia-romagna.it/cartpedo/"
catalogo = "https://mappegis.regione.emilia-romagna.it/gstatico/documenti/dati_pedol/Catalogo_suoli_RER.pdf"
download_250k = "https://mappegis.regione.emilia-romagna.it/moka/ckan/suolo/Carta_dei_suoli_250k_ed_1994.zip"  # non usato
# Le carte raster regionali 0-30 cm (Tessitura_0_30_cm_rst, Calcare_totale_0_30_cm_rst) sono sul WMS ma non
# risultano scaricabili dal geoportale; probabilmente su MinERva come il pH [da verificare].

[sources.suoli.attributes]
layer = "suoli_0_30"        # layer scritto da `prepare suoli`
ph_attr = "ph_0_30"
caco3_attr = "caco3_0_30"   # % (CALTOT)
texture_attr = "usda_0_30"  # classe USDA in inglese -> lookups/suoli_tessitura.csv

[sources.suoli.prepare]
# Nomi visti nel pacchetto Carta_Suoli_50k.zip scaricato il 2026-10-20.
shp_join = "XID_DELINE"   # shapefile: id delineazione
soils_sheet = "delin_suoli"
soils_join = "XID_DELIN"
soil_code = "SUOLO"
soil_name = "NOME_SUOLO"
soil_perc = "PERC"
soil_site = "ID_SITO"
sites_sheet = "delin_siti"
site_id = "ID_SITO"
top = "MIN"               # cm
bottom = "MAX"            # cm
sand = "SABBIA"           # %
silt = "LIMO"             # %
clay = "ARGILLA"          # %
caco3 = "CALTOT"          # % (vedi status_note)
ph = "PHH2O"
depth_cm = 30
raw_shp = ""              # vuoto = cerca l'unico .shp in data/raw/suoli/
raw_xlsx = ""             # vuoto = cerca l'unico .xlsx in data/raw/suoli/

