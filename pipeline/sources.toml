[sources.ph]
title = "Carta del pH dei suoli, strato 0-30 cm (2a edizione, 2023)"
use = "pH (preferito ai profili della carta dei suoli quando disponibile)"
params = ["ph"]
status = "da verificare"
status_note = "2026-10-20: le note illustrative (2a ed. 2023) descrivono 2 raster a 100 m in EPSG:7791 (pH_0_30.tif e pH_0_30_ACC.tif) scaricabili da MinERva, gruppo SUOLI (https://datacatalog.regione.emilia-romagna.it/catalogCTA/group/suolo). Host bloccato dal proxy di questo ambiente: va scaricato a mano. Sul WMS suoli è il layer Valori_ph_0_30_cm_rst."
license = "da verificare su MinERva (le note illustrative sono CC BY 4.0)"
crs = "EPSG:7791"
local_path = ""   # es. data/raw/ph/pH_0_30.tif dopo il download da MinERva

[sources.ph.endpoints]
note = "https://mappegis.regione.emilia-romagna.it/gstatico/documenti/dati_pedol/pH_0_30.pdf"
catalogo_minerva = "https://datacatalog.regione.emilia-romagna.it/catalogCTA/group/suolo"
wms = "https://servizigis.regione.emilia-romagna.it/wms/suoli"

[sources.ph.attributes]
band = 1
value_scale = 1.0   # le note parlano di "Valori di pH"; da confermare aprendo il file (check di range 2-11 nel build)

