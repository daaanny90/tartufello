[sources.geologia]
title = "Carta geologica 1:25.000/1:50.000 - Unità cartografabili geologiche (50k)"
use = "roccia madre"
params = ["bedrock"]
status = "ok"
status_note = "2026-10-20: zip open data Unita_geologiche_50K.zip (63449 poligoni, UTMRER = parametri EPSG:5659, Last-Modified 2021-02-15) con SIGLA, NOME_COMPL, DESCRIZION (litologia, compilata nel 75% dei poligoni della Val Baganza). Anche WFS 2.0.0 wfs/geologia50k (GEOJSON, paginazione) in EPSG:7791. Lo zip 1:10.000 indicato dal catalogo (Unita_geologiche_10k.zip) risponde 404. Il layer WFS Formazioni_geol ha descrizioni per formazione ma il filtro BBOX non funziona."
license = "CC BY 4.0 (catalogo geoportale, voce 'Carta geologica, 1:25.000 - Unità cartografabili geologiche - 50k'), letta il 2026-10-20"
crs = "EPSG:5659"
local_path = ""

[sources.geologia.endpoints]
download = "https://mappegis.regione.emilia-romagna.it/moka/ckan/geologia/Unita_geologiche_50K.zip"
wfs = "https://servizigis.regione.emilia-romagna.it/wfs/geologia50k"
wms = "https://servizigis.regione.emilia-romagna.it/wms/geologia50k"
webgis = "https://servizimoka.regione.emilia-romagna.it/mokaApp/applicazioni/geo"

[sources.geologia.service]
wfs_typename = "portale_geologia50k:Unita_geol_50k"
wfs_version = "2.0.0"
wfs_output_format = "GEOJSON"  # coordinate in lon/lat (RFC 7946) anche con SRSNAME=7791

[sources.geologia.attributes]
layer = "Unita_geologiche_50K"  # shapefile dello zip (nel WFS gli stessi campi, con NOME_COMPLETO)
unit_code_attr = "SIGLA"
unit_name_attr = "NOME_COMPL"

